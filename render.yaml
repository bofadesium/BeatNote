# Render blueprint: https://dashboard.render.com/blueprints -> New Blueprint Instance
# Creates one free Docker web service serving the web app and the API on one URL.
services:
  - type: web
    name: beatnote
    runtime: docker
    dockerContext: .
    dockerfilePath: ./deploy/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Optional: real Nemotron notes. Leave blank to use the built-in template note.
      - key: NVIDIA_API_KEY
        sync: false
